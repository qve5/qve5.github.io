<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ABHIS | Digital Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }

:root {
  /* Purple & Silver Theme */
  --purple: #b44fff;
  --purple-glow: rgba(180, 79, 255, 0.4);
  --silver: #e5e7eb;
  --silver-dim: #9ca3af;
  --silver-glow: rgba(229, 231, 235, 0.3);
  --text: rgba(255, 255, 255, 0.9);
}

html { scroll-behavior:smooth; }

body {
  min-height: 100vh;
  font-family: 'JetBrains Mono', monospace;
  color: var(--text);
  overflow-x: hidden;
  cursor: none;
  background-color: #06030c;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

/* ── PREMIUM BLURRED BACKGROUND ── */
.bg-img {
  position: fixed; inset: -20px; z-index: 0;
  background-image: url('silver-wolf-level-3840x2160-26448.jpg');
  background-size: cover;
  background-position: center;
  filter: blur(30px) brightness(0.45) saturate(1.2);
}

.bg-overlay {
  position: fixed; inset: 0; z-index: 1;
  background: radial-gradient(circle at center, transparent 20%, rgba(5, 2, 10, 0.8) 100%);
}

/* ── INTERACTIVE CURSOR ── */
#cur { position:fixed; top:0; left:0; z-index:9999; width:8px; height:8px; border-radius:50%; background:var(--silver); box-shadow:0 0 10px var(--silver), 0 0 22px var(--silver-glow); pointer-events:none; transform:translate(-50%,-50%); transition:width .12s, height .12s; }
#cur-ring { position:fixed; top:0; left:0; z-index:9998; width:32px; height:32px; border-radius:50%; border:1px solid rgba(255,255,255,0.3); pointer-events:none; transform:translate(-50%,-50%); transition:width .25s, height .25s, border-color .25s; }

/* ── PRELOADER ── */
#loader { position:fixed; inset:0; z-index:9990; background:#080410; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.6rem; }
.ld-name { font-family:'Orbitron',sans-serif; font-size:clamp(2rem,7vw,4rem); font-weight:900; letter-spacing:.2em; color:var(--silver); text-shadow:0 0 30px var(--silver-glow); animation:ld-pulse 0.8s ease-in-out infinite; }
@keyframes ld-pulse { 0%,100%{opacity:.4;} 50%{opacity:1;} }
.ld-bar-wrap { width:180px; height:1px; background:rgba(255,255,255,0.1); overflow:hidden; }
.ld-bar { height:100%; background:linear-gradient(90deg, var(--purple), var(--silver)); box-shadow:0 0 12px var(--purple); animation:ld-fill 1.5s ease-out forwards; }
@keyframes ld-fill { from{width:0} to{width:100%} }

/* ── MAIN INTERFACE CONTAINER ── */
.hub-container {
  position: relative;
  z-index: 3;
  width: 100%;
  max-width: 480px;
  padding: 4rem 1.5rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

/* PROFILE CONTAINER */
.profile-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: 1.5rem;
  animation: fadeUp 0.8s 0.2s both;
}

.avatar {
  width: 96px; height: 96px;
  border-radius: 50%;
  border: 1.5px solid rgba(255, 255, 255, 0.25);
  padding: 4px;
  background: rgba(255, 255, 255, 0.02);
  box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  margin-bottom: 1.2rem;
}
.avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

/* RE-DESIGNED LIVE STATUS CAPSULE */
.status-capsule {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 16px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 30px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: #747f8d; box-shadow: 0 0 8px #747f8d; transition: all 0.4s ease; }
.status-text { font-size: 0.62rem; font-weight: 500; letter-spacing: 0.02em; color: rgba(255, 255, 255, 0.75); }

/* ── SMOOTH GLOWING NAME ── */
.brand-name {
  font-family: 'Orbitron', sans-serif;
  font-weight: 700;
  font-size: clamp(2.8rem, 8vw, 4rem);
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: #ffffff;
  margin-top: 1rem;
  margin-bottom: 0.4rem;
  padding-left: 0.25em; /* Counteract absolute center offset from letter-spacing */
  user-select: none;
  cursor: none;
  animation: fadeUp 0.8s 0.35s both, ambientGlow 4s ease-in-out infinite alternate;
}

@keyframes ambientGlow {
  0% { text-shadow: 0 0 12px rgba(255, 255, 255, 0.35), 0 0 20px rgba(180, 79, 255, 0.15); }
  100% { text-shadow: 0 0 22px rgba(255, 255, 255, 0.65), 0 0 35px rgba(180, 79, 255, 0.45); }
}

.brand-subtitle {
  font-size: 0.58rem;
  letter-spacing: 0.22em;
  color: var(--silver-dim);
  text-transform: uppercase;
  margin-bottom: 2.5rem;
  animation: fadeUp 0.8s 0.5s both;
}

/* ── PILL STYLE LINKS LIST ── */
.links-list {
  display: flex;
  flex-direction: column;
  gap: 0.8rem;
  width: 100%;
  animation: fadeUp 0.8s 0.65s both;
}

.hub-btn {
  display: flex;
  align-items: center;
  width: 100%;
  padding: 1rem 1.6rem;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.78rem;
  font-weight: 400;
  color: rgba(255, 255, 255, 0.85);
  text-decoration: none;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 100px; /* Perfect sleek capsule design */
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  cursor: none;
  transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
}

.hub-btn:hover {
  background: rgba(255, 255, 255, 0.07);
  border-color: rgba(180, 79, 255, 0.35);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2), 0 0 15px rgba(180, 79, 255, 0.15);
  transform: translateY(-2px);
  color: #ffffff;
}

.btn-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  margin-right: 1rem;
  color: rgba(255, 255, 255, 0.6);
  transition: color 0.3s ease;
}
.hub-btn:hover .btn-icon { color: var(--purple); }
.btn-icon svg { width: 16px; height: 16px; fill: currentColor; }
.btn-icon svg[stroke] { fill: none; }

.btn-label { flex: 1; text-align: left; }

.btn-arrow {
  font-size: 0.85rem;
  opacity: 0.3;
  transition: all 0.3s ease;
  color: #ffffff;
}
.hub-btn:hover .btn-arrow { opacity: 0.9; transform: translate(2px, -2px); color: var(--purple); }

/* Unified Special Server Card Row */
.server-card {
  border: 1px solid rgba(180, 79, 255, 0.25);
  background: linear-gradient(90deg, rgba(180, 79, 255, 0.03), rgba(255, 255, 255, 0.02));
}
.server-online-text { font-size: 0.6rem; color: var(--silver-dim); margin-left: 0.5rem; }

/* ── MINIMALIST CENTERED FOOTER ── */
footer {
  margin-top: 4rem;
  font-size: 0.6rem;
  letter-spacing: 0.15em;
  color: rgba(255, 255, 255, 0.35);
  text-transform: uppercase;
  animation: fadeUp 0.8s 0.8s both;
}

/* ── ANIMATION BASE ── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<script>
  // 1. Dynamic Footer Year
  document.getElementById('year').textContent = new Date().getFullYear();

  // 2. Fluid Dual-Trailing Cursor
  const cur = document.getElementById('cur');
  const ring = document.getElementById('cur-ring');
  let mx = 0, my = 0, rx = 0, ry = 0;
  
  document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
  
  function animCursor() {
    rx += (mx - rx) * 0.18; ry += (my - ry) * 0.18;
    cur.style.left = mx + 'px'; cur.style.top = my + 'px';
    ring.style.left = rx + 'px'; ring.style.top = ry + 'px';
    requestAnimationFrame(animCursor);
  }
  animCursor();

  document.querySelectorAll('a').forEach(el => {
    el.addEventListener('mouseenter', () => {
      cur.style.width = '4px'; cur.style.height = '4px';
      ring.style.width = '48px'; ring.style.height = '48px';
      ring.style.borderColor = 'var(--purple)';
      ring.style.backgroundColor = 'rgba(180, 79, 255, 0.05)';
    });
    el.addEventListener('mouseleave', () => {
      cur.style.width = '8px'; cur.style.height = '8px';
      ring.style.width = '32px'; ring.style.height = '32px';
      ring.style.borderColor = 'rgba(255,255,255,0.3)';
      ring.style.backgroundColor = 'transparent';
    });
  });

  // 3. Remove Loader Screen smoothly
  window.addEventListener('load', () => {
    setTimeout(() => {
      const loader = document.getElementById('loader');
      loader.style.transition = 'opacity 0.5s ease';
      loader.style.opacity = '0';
      setTimeout(() => loader.style.display = 'none', 500);
    }, 1200);
  });

  // 4. Live User Discord Status Pill integration (Lanyard API)
  const lanyardAPI = 'https://api.lanyard.rest/v1/users/723681043336658966';
  const statusDot = document.getElementById('discord-dot');
  const statusText = document.getElementById('discord-status-text');

  async function fetchUserStatus() {
    try {
      const res = await fetch(lanyardAPI);
      const json = await res.json();
      if (json.success) {
        const d = json.data;
        
        let color = '#747f8d'; // Default Offline color
        if (d.discord_status === 'online') color = '#23a559';
        else if (d.discord_status === 'idle') color = '#f0b232';
        else if (d.discord_status === 'dnd') color = '#f23f43';
        
        statusDot.style.backgroundColor = color;
        statusDot.style.boxShadow = `0 0 10px ${color}`;

        let currentStatus = 'Currently Offline';
        if (d.discord_status !== 'offline') currentStatus = 'Currently Online';

        if (d.activities && d.activities.length > 0) {
          const customStatus = d.activities.find(a => a.type === 4);
          const playingGame = d.activities.find(a => a.type === 0);
          const listeningSpotify = d.spotify;

          if (customStatus && customStatus.state) {
            currentStatus = customStatus.state;
          } else if (playingGame) {
            currentStatus = `Playing ${playingGame.name}`;
          } else if (listeningSpotify) {
            currentStatus = `Listening to Spotify`;
          }
        }
        statusText.textContent = currentStatus;
      }
    } catch (err) {
      statusText.textContent = 'Status Signal Offline';
    }
  }

  // 5. Discord Widget Server Members Sync
  const guildAPI = 'https://discord.com/api/guilds/1503255333869715517/widget.json';
  const serverText = document.getElementById('server-members');

  async function fetchServerStatus() {
    try {
      const res = await fetch(guildAPI);
      if (!res.ok) throw new Error("Unavailable");
      const json = await res.json();
      
      if (json.presence_count !== undefined) {
        serverText.textContent = `· ${json.presence_count} Online`;
      } else {
        serverText.textContent = '· Join';
      }
    } catch (err) {
      serverText.textContent = '';
    }
  }

  fetchUserStatus();
  fetchServerStatus();
  setInterval(fetchUserStatus, 15000);
  setInterval(fetchServerStatus, 30000);
</script>
